<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate and plot displacement</title>
    <link href="style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <h1>Calculate and plot displacement</h1>

    <div class="container">
      <!-- Form Section -->
      <div class="form-box">
        <form id="inputForm">
          <div>
            <label>Initial velocity (u):</label>
            <input type="number" id="u" step="any" required>
            <span>m/s</span>
          </div>

          <div>
            <label>Acceleration (a):</label>
            <input type="number" id="a" step="any" required>
            <span>m/s²</span>
          </div>

          <div>
            <label>Total time (t):</label>
            <input type="number" id="t" step="any" required>
            <span>s</span>
          </div>

          <div>
            <label>Displacement (s):</label>
            <input type="text" id="displacement" readonly>
            <span>m</span>
          </div>

          <div>
            <label>Number of samples:</label>
            <select id="samples">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="30">30</option>
              <option value="40">40</option>
              <option value="50">50</option>
              <option value="60">60</option>
              <option value="70">70</option>
              <option value="80">80</option>
              <option value="90">90</option>
              <option value="100">100</option>
            </select>
          </div>

          <input type="submit" value="Calculate">
        </form>
      </div>

      <!-- Chart Section -->
      <div class="chart-box">
        <canvas id="myChart"></canvas>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
